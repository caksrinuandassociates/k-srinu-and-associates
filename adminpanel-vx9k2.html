<!DOCTYPE html>
<html lang="en">
  <!-- Internal admin panel for K Srinu and Associates -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel | K Srinu and Associates</title>
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { theme: { extend: { colors: { navy: "#0f2747", gold: "#b99746" } } } };
    </script>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <main class="pt-10 pb-10 px-4 sm:px-6 lg:px-8">
      <div class="container-premium">
        <section id="login-panel" class="card p-6 sm:p-8 max-w-xl mx-auto">
          <h1 class="heading-lg">Admin Login</h1>
          <p class="subtitle mt-2 text-sm">Internal access only.</p>
          <form id="login-form" class="mt-4 grid gap-3">
            <input id="admin-email" class="contact-input" type="email" placeholder="Admin email" required />
            <input id="admin-password" class="contact-input" type="password" placeholder="Password" required />
            <button class="btn-primary" type="submit">Sign In</button>
          </form>
          <p id="auth-message" class="subtitle text-sm mt-3"></p>
        </section>

        <section id="dashboard" class="hidden">
          <div class="card p-4 sm:p-6">
            <div class="flex items-center justify-between gap-3 flex-wrap">
              <h2 class="heading-lg">Admin Dashboard</h2>
              <button id="logout-btn" class="btn-secondary">Logout</button>
            </div>

            <div id="admin-tabs" class="mt-4 flex flex-wrap gap-2">
              <button class="btn-primary tab-btn" data-tab="compliance">Compliance Calendar</button>
              <button class="btn-secondary tab-btn" data-tab="team">Team Members</button>
              <button class="btn-secondary tab-btn" data-tab="careers">Careers</button>
              <button class="btn-secondary tab-btn" data-tab="settings">Site Settings</button>
            </div>

            <p id="admin-message" class="subtitle text-sm mt-3"></p>

            <div id="tab-compliance" class="tab-panel mt-5">
              <h3 class="font-bold text-navy text-lg">Compliance Calendar</h3>
              <form id="compliance-form" class="mt-3 grid gap-3 sm:grid-cols-2">
                <input type="hidden" id="compliance-id" />
                <input class="contact-input" id="c-title" placeholder="title" required />
                <select class="contact-input" id="c-category" required>
                  <option value="">Select category</option>
                  <option>GST</option><option>Income Tax</option><option>TDS</option><option>ROC</option>
                  <option>Professional Tax</option><option>Business Compliance</option><option>Labour Compliance</option><option>Other</option>
                </select>
                <select class="contact-input" id="c-state" required>
                  <option value="">Select state</option>
                  <option value="all-india">All India</option><option value="andhra-pradesh">Andhra Pradesh</option><option value="telangana">Telangana</option>
                  <option value="tamil-nadu">Tamil Nadu</option><option value="karnataka">Karnataka</option><option value="maharashtra">Maharashtra</option>
                  <option value="delhi">Delhi</option><option value="kerala">Kerala</option><option value="other-states">Other States</option>
                </select>
                <input class="contact-input" id="c-due-date" placeholder="due_date" />
                <input class="contact-input" id="c-frequency" placeholder="frequency" />
                <input class="contact-input" id="c-applicable" placeholder="applicable_to" />
                <select class="contact-input" id="c-status"><option>Indicative</option><option>Upcoming</option><option>Important</option><option>Updated</option></select>
                <input class="contact-input sm:col-span-2" id="c-source" placeholder="source_url" />
                <textarea class="contact-textarea sm:col-span-2" id="c-description" rows="3" placeholder="description"></textarea>
                <label class="text-sm"><input type="checkbox" id="c-national" /> is_national</label>
                <label class="text-sm"><input type="checkbox" id="c-active" checked /> is_active</label>
                <div class="sm:col-span-2 flex gap-2"><button id="compliance-submit" class="btn-primary" type="submit">Save Compliance Item</button><button id="compliance-clear" class="btn-secondary" type="button">Clear</button></div>
              </form>
              <div class="card p-4 mt-4">
                <h4 class="font-semibold text-navy">Live Compliance Preview</h4>
                <div id="compliance-live-preview" class="mt-3"></div>
              </div>
              <input id="compliance-search" class="contact-input mt-4" placeholder="Search compliance records" />
              <div id="compliance-list" class="mt-4 grid gap-3"></div>
            </div>

            <div id="tab-team" class="tab-panel mt-5 hidden">
              <h3 class="font-bold text-navy text-lg">Team Members</h3>
              <form id="team-form" class="mt-3 grid gap-3 sm:grid-cols-2">
                <input type="hidden" id="team-id" />
                <input class="contact-input" id="t-name" placeholder="name" required />
                <input class="contact-input" id="t-designation" placeholder="designation" required />
                <input class="contact-input" id="t-image-file" type="file" accept="image/*" />
                <input class="contact-input" id="t-image" placeholder="image_url" />
                <img id="t-image-preview" class="h-14 w-14 rounded-full border border-slate-200 object-cover" alt="Preview" style="display:none" />
                <input class="contact-input" id="t-tags" placeholder="tags (comma separated)" />
                <p id="t-tags-preview" class="subtitle text-xs sm:col-span-2"></p>
                <input class="contact-input" id="t-order" type="number" placeholder="display_order" />
                <textarea class="contact-textarea sm:col-span-2" id="t-bio" rows="3" placeholder="bio"></textarea>
                <label class="text-sm"><input type="checkbox" id="t-active" checked /> is_active</label>
                <div class="sm:col-span-2 flex gap-2"><button id="team-submit" class="btn-primary" type="submit">Save Team Member</button><button id="team-clear" class="btn-secondary" type="button">Clear</button></div>
              </form>
              <div class="card p-4 mt-4">
                <h4 class="font-semibold text-navy">Live Team Preview</h4>
                <div id="team-live-preview" class="mt-3"></div>
              </div>
              <input id="team-search" class="contact-input mt-4" placeholder="Search team records" />
              <div id="team-list" class="mt-4 grid gap-3"></div>
            </div>

            <div id="tab-careers" class="tab-panel mt-5 hidden">
              <h3 class="font-bold text-navy text-lg">Careers</h3>
              <form id="career-form" class="mt-3 grid gap-3 sm:grid-cols-2">
                <input type="hidden" id="career-id" />
                <input class="contact-input" id="j-title" placeholder="title" required />
                <select class="contact-input" id="j-type"><option>Full-time</option><option>Part-time</option><option>Internship</option><option>Articleship</option><option>Contract</option></select>
                <select class="contact-input" id="j-exp"><option>Fresher</option><option>0-1 Years</option><option>1-3 Years</option><option>3-5 Years</option><option>5+ Years</option></select>
                <input class="contact-input" id="j-location" placeholder="location" />
                <textarea class="contact-textarea sm:col-span-2" id="j-description" rows="3" placeholder="description"></textarea>
                <textarea class="contact-textarea sm:col-span-2" id="j-requirements" rows="3" placeholder="requirements"></textarea>
                <label class="text-sm"><input type="checkbox" id="j-intern" /> is_internship</label>
                <label class="text-sm"><input type="checkbox" id="j-active" checked /> is_active</label>
                <div class="sm:col-span-2 flex gap-2"><button id="career-submit" class="btn-primary" type="submit">Save Career Opening</button><button id="career-clear" class="btn-secondary" type="button">Clear</button></div>
              </form>
              <div class="card p-4 mt-4">
                <h4 class="font-semibold text-navy">Live Career Preview</h4>
                <div id="career-live-preview" class="mt-3"></div>
              </div>
              <input id="careers-search" class="contact-input mt-4" placeholder="Search career records" />
              <div id="careers-list" class="mt-4 grid gap-3"></div>
            </div>

            <div id="tab-settings" class="tab-panel mt-5 hidden">
              <h3 class="font-bold text-navy text-lg">Site Settings</h3>
              <form id="settings-form" class="mt-3 grid gap-3 sm:grid-cols-2">
                <input type="hidden" id="s-id" />
                <input class="contact-input" id="s-phone" placeholder="phone" />
                <input class="contact-input" id="s-email" placeholder="email" />
                <input class="contact-input" id="s-whatsapp" placeholder="whatsapp" />
                <input class="contact-input" id="s-map" placeholder="map link" />
                <input class="contact-input sm:col-span-2" id="s-footer" placeholder="footer text" />
                <textarea class="contact-textarea sm:col-span-2" id="s-address" rows="3" placeholder="address"></textarea>
                <button class="btn-primary sm:col-span-2" type="submit">Save Settings</button>
              </form>
              <div class="card p-4 mt-4">
                <h4 class="font-semibold text-navy">Live Contact/Footer Preview</h4>
                <div id="settings-live-preview" class="mt-3"></div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
    <div id="admin-toast" class="hidden fixed bottom-4 right-4 z-[9999] rounded-lg px-4 py-3 text-sm font-medium shadow-lg"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/adminpanel-vx9k2.js"></script>
  </body>
</html>
